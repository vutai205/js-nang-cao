<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thêm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="d-flex justify-content-between align-items-center px-3 py-2 shadow-sm"
     style="background: linear-gradient(to right, #1f1f1f, #2c2c2c);">
  <span class="text-white fw-semibold">Thêm Sản Phẩm</span>
  <div>
    <button class="btn btn-outline-light btn-sm me-2">🌙</button>
    <a href="index.html" class="btn btn-success btn-sm">← Danh sách</a>
  </div>
</nav>

<div class="container py-4">

  <div class="card shadow-sm border-0">

    <div class="card-header bg-white">
      <h5 class="mb-0">Thêm sản phẩm</h5>
    </div>

    <div class="card-body">

       <form id="form">
            <div class="mb-3">
                <label for="name" class="form-label">Tên Sản Phẩm</label>
                <input type="text" class="form-control" id="name" aria-describedby="name">
            </div>
            <div class="mb-3">
                <label for="position" class="form-label">Giá</label>
                <input type="number" class="form-control" id="imageUrl" aria-describedby="price">
            </div>
            <div class="mb-3">
                <label for="age" class="form-label">Hình Ảnh</label>
                <input type="text" class="form-control" id="imageUrl" aria-describedby="imageUrl">
            </div>
            <div class="mb-3">
                <label for="salary" class="form-label">Danh Mục</label>
                <select name="category" id="category" class="form-control" aria-describedby="price">
                  <option value="Áo">Áo</option>
                  <option value="Quần">Quần</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
  </div>
</div>

</body>
</html>
