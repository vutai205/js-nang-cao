<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(135deg, #667eea, #764ba2); height:100vh;">

<div class="d-flex justify-content-center align-items-center h-100">

  <div class="card shadow-lg p-4 border-0" style="width: 350px; border-radius:15px;">
    
    <h3 class="text-center mb-3">📝 Đăng ký</h3>
    <p class="text-center text-muted" style="font-size:14px;">Tạo tài khoản mới</p>

    <form id="form">
      <div class="mb-2">
        <label class="form-label">Tên</label>
        <input id="name" type="text" class="form-control" placeholder="Nhập tên...">
      </div>

      <div class="mb-2">
        <label class="form-label">Email</label>
        <input id="email" type="email" class="form-control" placeholder="Nhập email...">
      </div>

      <div class="mb-2">
        <label class="form-label">Mật khẩu</label>
        <input id="password" type="password" class="form-control" placeholder="••••••">
      </div>

      <button class="btn btn-primary w-100 mb-2">Đăng ký</button>

      <div class="text-center">
        <small>Đã có tài khoản? 
          <a href="signin.html">Đăng nhập</a>
        </small>
      </div>
    </form>

  </div>

</div>
<script>
  const form = document.querySelector('#form')
  form.addEventListener('submit',async(e)=>{
    e.preventDefault();
    const name = document.querySelector("#name").value
    const email = document.querySelector("#email").value
    const password = document.querySelector("#password").value

    if(!name){
      alert("Mày Tên Là Gì")
      return
    }
    if(!email){
      alert("Không Có Email")
      return
    }
    if(!password){
      alert("Thiếu Mật Khẩu")
      return
    }

    await fetch('http://localhost:3000/register',{
      method:"POST",
      headers:{
        "Content-type":"application/json"
      },
      body:JSON.stringify({
        name,email,password
      })
    })
    window.location.href="signin.html"
  })
</script>
</body>
</html>
