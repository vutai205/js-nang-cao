<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Product Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
      <span class="navbar-brand">🛒 Product Manager</span>

      <div>
        <button class="btn btn-outline-light btn-sm me-2">🌙</button>
        <a href="add.html" class="btn btn-success btn-sm">+ Thêm</a>
        <a href="signin.html" class="btn btn-outline-light btn-sm me-2">🔐 Login</a>
        <a href="signup.html" class="btn btn-warning btn-sm me-2">📝 Register</a>
      </div>
    </div>
  </nav>


  <!-- CONTENT -->
  <div class="container py-4">

    <div class="mb-3 d-flex">
      <input type="text" id="searchInput" class="form-control me-2" placeholder="Tìm theo tên sách...">
      <button class="btn btn-primary" onclick="searchProducts()">Tìm</button>
    </div>

    <!-- CARD -->
    <div class="card shadow-sm border-0">

      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Danh sách sản phẩm</h5>
      </div>


      <div class="card-body p-0">
        <table class="table table-hover align-middle text-center mb-0">

          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Tên Sản Phẩm</th>
              <th>Giá</th>
              <th>Hình ảnh</th>
              <th>Danh Mục</th>
              <th>Hành động</th>
            </tr>
          </thead>

          <tbody id="productList">

          </tbody>

        </table>
      </div>
    </div>

    <!-- PAGINATION UI -->
    <div class="d-flex justify-content-center align-items-center mt-3">
      <button class="btn btn-sm btn-outline-primary me-2">Prev</button>
      <span>Page 1</span>
      <button class="btn btn-sm btn-outline-primary ms-2">Next</button>
    </div>
  
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   
</body>

</html>
