<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Tiệm Sâch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
      <span class="navbar-brand">🛒 Tiệm Sâch</span>

      <div>
        <button class="btn btn-outline-light btn-sm me-2">🌙</button>
        <a href="add.html" class="btn btn-success btn-sm">+ Thêm</a>
        <a href="signin.html" class="btn btn-outline-light btn-sm me-2">🔐 Login</a>
        <a href="signup.html" class="btn btn-warning btn-sm me-2">📝 Register</a>
      </div>
    </div>
  </nav>


  <!-- CONTENT -->
  <div class="container py-4">

    <div class="mb-3 d-flex">
      <input type="text" id="searchInput" class="form-control me-2" placeholder="Tìm theo tên sách...">
      <button class="btn btn-primary" onclick="searchProducts()">Tìm</button>
    </div>

    <!-- CARD -->
    <div class="card shadow-sm border-0">

      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Danh sách sản phẩm</h5>
      </div>


      <div class="card-body p-0">
        <table class="table table-hover align-middle text-center mb-0">

          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Tên Sách</th>
              <th>Tác Giả</th>
              <th>Giá</th>
              <th>Hình Ảnh</th>
              <th>Thể Loại</th>
              <th>Hành động</th>
            </tr>
          </thead>

          <tbody id="books">

          </tbody>

        </table>
      </div>
    </div>

    <!-- PAGINATION UI -->
    <div class="d-flex justify-content-center align-items-center mt-3">
      <button class="btn btn-sm btn-outline-primary me-2">Prev</button>
      <span>Page 1</span>
      <button class="btn btn-sm btn-outline-primary ms-2">Next</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
      const Books = document.querySelector('#books')
      const getBooks = async()=>{
        const response = await fetch('http://localhost:3000/books')
        const data = await response.json()
        Books.innerHTML=data.map((book,index)=>`
        <tr>
      <td>${index+1}</td>
      <td>${book.title}</td>
      <td>${book.author}</td>
      <td>${book.price}</td>
      <td><img src="${book.coverImage}" width="100"></td>
      <td>${book.genre}</td>
      <td>
        <a href="edit.html?id=${book.id}" class="btn btn-primary">Sửa</a>
        <button onClick="remove(${book.id})" class="btn btn-danger">Xoá</button>
        </td>
    </tr>
        `).join("")
      }
      getBooks();

      const remove = async(id)=>{
        const confirm = window.confirm("Chắc Chán Xoá Chưa")
        if(!confirm)return
        await fetch (`http://localhost:3000/books/${id}`,{
          method:"DELETE"
        })
        alert("Đã Xoá Thành Công")
      }
  </script>
</body>

</html>
