<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

  <form id="form" class="bg-white p-4 rounded shadow" style="width:300px">
    <h4 class="text-center mb-3">Đăng nhập</h4>

    <input id="email" type="email" class="form-control mb-2" placeholder="Email">
    <input id="password" type="password" class="form-control mb-3" placeholder="Password">

    <button class="btn btn-primary w-100">Login</button>
  </form>
<script>
  const form = document.querySelector('#form')
  form.addEventListener('submit',async(e)=>{
    e.preventDefault();
    const name = document.querySelector("#name").value
    const email = document.querySelector("#email").value
    const password = document.querySelector("#password").value

    if(!name){
      alert("Mày Tên Là Gì")
      return
    }
    if(!email){
      alert("Không Có Email")
      return
    }
    if(!password){
      alert("Thiếu Mật Khẩu")
      return
    }

   const response = await fetch('http://localhost:3000/login',{
      method:"POST",
      headers:{
        "Content-type":"application/json"
      },
      body:JSON.stringify({
        name,email,password
      })
    })
  })
</script>
  
</body>
</html>
